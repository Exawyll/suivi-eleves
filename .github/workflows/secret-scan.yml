name: Secret scanning

on:
  pull_request:
    # Same reason as ci.yml: the v2 accounts work stacks on an integration
    # branch, and a review that only runs on pull requests to main would skip
    # every one of them.
    branches: [main, feature/carnet-v2-comptes]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
