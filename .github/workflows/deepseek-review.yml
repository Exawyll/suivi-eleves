name: DeepSeek Review

on:
  pull_request:
    # Same reason as ci.yml: the v2 accounts work stacks on an integration
    # branch, and a review that only runs on pull requests to main would skip
    # every one of them.
    branches: [main, feature/carnet-v2-comptes]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review PR diff with DeepSeek V4 Pro
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not set — skipping DeepSeek review."
            exit 0
          fi

          git fetch origin "$BASE_REF" --depth=1
          git diff "origin/$BASE_REF...HEAD" > pr.diff
          head -c 60000 pr.diff > pr.diff.trimmed && mv pr.diff.trimmed pr.diff

          if [ ! -s pr.diff ]; then
            echo "Empty diff, nothing to review."
            exit 0
          fi

          payload=$(jq -n --rawfile diff pr.diff '{
            model: "deepseek-v4-pro",
            temperature: 0.2,
            # The answer is a short bullet list; without a ceiling the request
            # is only bounded by the model deciding to stop, which is what kept
            # pushing it past the deadline.
            max_tokens: 900,
            messages: [
              {role: "system", content: "Tu es un reviewer de code senior. Analyse ce diff de pull request et signale uniquement les bugs réels, failles de sécurité et régressions probables — pas de style ni de formatage. Réponds en français, en liste à puces, une ligne par problème avec le fichier concerné si identifiable. Si tu ne vois rien à signaler, dis-le explicitement en une phrase."},
              {role: "user", content: $diff}
            ]
          }')

          # `|| echo 000` matters: the step runs under `bash -e`, so a curl
          # that times out or cannot connect would kill it here and the guard
          # below — written precisely to keep this review advisory — would
          # never run. That is how a 120 s timeout on a large diff turned into
          # a red check on a pull request whose code was fine.
          #
          # The deadline has moved twice since: a 60 KB diff genuinely takes
          # minutes, and at 300 s the review still expired — leaving a stale
          # comment standing while the job reported success, which is worse
          # than a red check. 900 s plus the max_tokens ceiling above is what
          # makes it actually finish.
          http_code=$(curl -sS -o response.json -w "%{http_code}" --max-time 900 \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo 000)

          if [ "$http_code" != "200" ]; then
            echo "DeepSeek review unavailable (HTTP $http_code) — not blocking the PR."
            cat response.json 2>/dev/null || true
            exit 0
          fi

          { echo "## 🔎 Revue automatique — DeepSeek V4 Pro"; echo; jq -r '.choices[0].message.content' response.json; } > comment.md

          gh pr comment "$PR_NUMBER" --edit-last --body-file comment.md \
            || gh pr comment "$PR_NUMBER" --body-file comment.md
