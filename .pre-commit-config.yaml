repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-direct-main-commit
        name: Interdit les commits directs sur main
        entry: >-
          bash -c 'branch=$(git rev-parse --abbrev-ref HEAD);
          if [ "$branch" = "main" ]; then
          echo "Interdit : commit direct sur main. Crée une branche (voir CLAUDE.md).";
          exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false

      - id: no-design-handoff-bundle
        name: Bloque le bundle handoff Claude Design (hands-off)
        entry: >-
          bash -c 'echo "Fichier issu du bundle Claude Design (hands-off) : jamais commité, voir .gitignore.";
          exit 1'
        language: system
        files: '(^|/)_ds/|\.dc\.html$|_ds_manifest\.json$|_adherence\.oxlintrc\.json$|(^|/)\.thumbnail$|^suivi-d-l-ves-hors-ligne/'
